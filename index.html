<style>

<body>
<div class="tag">new vlog</div>
<h1 id="t">building the brand | hiring in buenos aires (part 2)</h1>
<div class="player"><div id="yt"></div></div>
<div class="row">
  <button class="ghost" id="snd">tap for sound</button>
  <a class="btn solid" id="enter" href="/home.html">enter site &gt;</a>
</div>
<a class="small" href="https://taylordesseyn.beehiiv.com/?utm_source=tdesseyn.com&amp;utm_medium=vlog-intro&amp;utm_campaign=vlog-intro" target="_blank" rel="noopener">get my weekly email</a>
<script>
document.getElementById("t").textContent=VLOG_TITLE;
var enter=document.getElementById("enter"); enter.href=SITE;
function seen(){try{localStorage.setItem("seen_"+VLOG_ID,"1")}catch(e){}}
enter.addEventListener("click",seen);
var player;
function onYouTubeIframeAPIReady(){
  player=new YT.Player("yt",{videoId:VLOG_ID,playerVars:{autoplay:1,mute:1,playsinline:1,rel:0,modestbranding:1},
    events:{onReady:function(e){e.target.mute();e.target.playVideo();seen();},
            onStateChange:function(e){if(e.data===0){location.href=SITE;}}}});
}
document.getElementById("snd").addEventListener("click",function(){
  if(!player)return; if(player.isMuted()){player.unMute();player.setVolume(100);player.playVideo();this.textContent="mute";}else{player.mute();this.textContent="tap for sound";}
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
